<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Protected Redirect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {
      margin: 0.5rem 0;
      padding: 0.5rem;
      width: 100%;
    }
    button {
      padding: 0.5rem 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Enter Access Credentials</h2>
    <input type="password" id="pass1" placeholder="Enter first password"><br>
    <input type="password" id="pass2" placeholder="Enter second password"><br>
    <input type="password" id="pass3" placeholder="Enter third password"><br>
    <button onclick="checkPasswords()">Confirm</button>
    <p id="error" style="color:red;"></p>
  </div>

  <script>
    function checkPasswords() {
      const inputs = [
        document.getElementById('pass1').value,
        document.getElementById('pass2').value,
        document.getElementById('pass3').value
      ];

      const validPasswords = [
        "Foxtrot03Clearance",
        "OrbitSecure67",
        "PassThree10",
        "SecureKey44",
        "Zeta99Lock"
      ];

      // Count how many entered passwords are in the list of valid passwords
      let matchCount = 0;
      const used = new Set();
      inputs.forEach(input => {
        if (validPasswords.includes(input) && !used.has(input)) {
          matchCount++;
          used.add(input);
        }
      });

      if (matchCount >= 3) {
        window.location.href = "https://sites.google.com/view/gpcsuccessionprotocol-securebe/home";
      } else {
        document.getElementById("error").innerText = "At least 3 correct passwords required. Please try again.";
      }
    }
  </script>
</body>

    }
  </script>
</body>
</html>
