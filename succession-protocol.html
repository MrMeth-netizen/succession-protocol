<!DOCTYPE html>

<head>

      flex-direction: column;

      justify-content: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input {

      padding: 0.5rem;

    }
    button {

      margin-top: 1rem;
    }
  </style>
</head>
